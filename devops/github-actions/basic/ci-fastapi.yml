name: FastAPI CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run pytest