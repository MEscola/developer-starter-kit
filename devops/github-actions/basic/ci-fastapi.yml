name: FastAPI CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run pytest