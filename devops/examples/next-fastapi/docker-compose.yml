services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

    depends_on:
      - backend

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env.example

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: